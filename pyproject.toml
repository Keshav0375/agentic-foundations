[project]
name = "agentic-foundations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "keshxv", email = "keshavkumar2015075@gndec.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.96.0",
    "pydantic>=2.13.2",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
]

[project.scripts]
agentic-foundations = "agentic_foundations:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]
